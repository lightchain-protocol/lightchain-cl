# Sample chain config for the release smoke test. Not a live network config:
# it only has to exercise the fields this fork adds on top of upstream Prysm —
# ELECTRA_FORK_EPOCH (Prague/Electra) and the piecewise slot-time schedule —
# so a build that dropped either one fails the release.
CONFIG_NAME: lightchain-smoke
PRESET_BASE: mainnet
TERMINAL_TOTAL_DIFFICULTY: 0
MIN_GENESIS_ACTIVE_VALIDATOR_COUNT: 4
MIN_GENESIS_TIME: 0
GENESIS_FORK_VERSION: 0x20000089
GENESIS_DELAY: 0
ALTAIR_FORK_VERSION: 0x20000090
ALTAIR_FORK_EPOCH: 0
BELLATRIX_FORK_VERSION: 0x20000091
BELLATRIX_FORK_EPOCH: 0
CAPELLA_FORK_VERSION: 0x20000092
CAPELLA_FORK_EPOCH: 0
DENEB_FORK_VERSION: 0x20000093
DENEB_FORK_EPOCH: 0
ELECTRA_FORK_VERSION: 0x20000094
ELECTRA_FORK_EPOCH: 0
FULU_FORK_VERSION: 0x20000095
FULU_FORK_EPOCH: 18446744073709551615
SECONDS_PER_SLOT: 6
SLOT_DURATION_MS: 6000
SLOTS_PER_EPOCH: 6
SLOT_TIME_FORK_ONE_SLOT: 1869906
SLOT_TIME_FORK_ONE_MS: 2000
DEPOSIT_CHAIN_ID: 8200
DEPOSIT_NETWORK_ID: 8200
DEPOSIT_CONTRACT_ADDRESS: 0x4242424242424242424242424242424242424242
