# Every pull request: build the tree and test the packages this fork changes. The rest is upstream Prysm and is tested
# there.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...

      # The fork's changes: the inactivity ejection in epoch processing, the slot schedule and what is timed by it, the
      # genesis tooling in prysmctl, and the assertion helper the tests use.
      #
      # Skipped: the tests that read their data from a Bazel runfiles directory, which go test does not provide.
      #
      # -count=1 makes go test run every test. Without it, the build cache that setup-go restores also carries the test
      # results of the last run, and a package whose test binary has not changed is reported as "ok (cached)" unrun.
      #
      # LightChain: added the live Electra epoch path and what it runs on: core/electra, core/helpers, core/transition
      # (with the mainnet-config release-gate test, lightchain_mainnet_config_test.go), core/epoch with its precompute
      # package, and forkchoice. None of them ran in CI, which is how the 2026-11-19 overflow reached mainnet (audit
      # 2026-11-20, X1, X2, R1). release.yml runs these same commands on every tagged commit before it publishes.
      #
      # LightChain: also skipped, five upstream core/helpers tests (sync_committee_test.go) that need an empty
      # sync-committee cache and fail when the whole package runs in one go test process:
      # TestCurrentEpochSyncSubcommitteeIndices_UsingCommittee fails on every run, and the four
      # Test{IsCurrentEpochSyncCommittee,IsNextEpochSyncCommittee,CurrentEpochSyncSubcommitteeIndices,
      # NextEpochSyncSubcommitteeIndices}_DoesNotExist share the cause (IsCurrent and CurrentSubcommittee seen failing
      # here and in CI, the other two not yet). On a cache miss the sync-committee helpers fill the cache in a
      # goroutine, so a fill started by an earlier test lands after the helpers.ClearCache() these tests start with.
      # They pass when run alone; the fork does not change this code.
      - run: >
          go test -count=1 -tags develop -timeout 30m
          -skip '^(TestEIP3076SpecTests|TestLoadConfigFile|Test(Mainnet|Holesky|Hoodi|Sepolia)ConfigMatchesUpstreamYaml|TestCurrentEpochSyncSubcommitteeIndices_UsingCommittee|Test(IsCurrentEpochSyncCommittee|IsNextEpochSyncCommittee|CurrentEpochSyncSubcommitteeIndices|NextEpochSyncSubcommitteeIndices)_DoesNotExist)$'
          ./beacon-chain/blockchain
          ./beacon-chain/core/altair
          ./beacon-chain/core/electra/...
          ./beacon-chain/core/epoch/...
          ./beacon-chain/core/helpers/...
          ./beacon-chain/core/transition/...
          ./beacon-chain/execution
          ./beacon-chain/forkchoice/...
          ./beacon-chain/operations/attestations
          ./cmd/prysmctl/testnet
          ./config/params
          ./testing/assertions
          ./time/slots
          ./validator/client
