# Every pull request: build the tree and test the packages this fork changes. The rest is upstream Prysm and is tested
# there.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...

      # The fork's changes: the inactivity ejection in epoch processing, the slot schedule and what is timed by it, the
      # genesis tooling in prysmctl, and the assertion helper the tests use.
      #
      # Skipped: the tests that read their data from a Bazel runfiles directory, which go test does not provide.
      #
      # -count=1 makes go test run every test. Without it, the build cache that setup-go restores also carries the test
      # results of the last run, and a package whose test binary has not changed is reported as "ok (cached)" unrun.
      - run: >
          go test -count=1 -tags develop -timeout 30m
          -skip '^(TestEIP3076SpecTests|TestLoadConfigFile|Test(Mainnet|Holesky|Hoodi|Sepolia)ConfigMatchesUpstreamYaml)$'
          ./beacon-chain/blockchain
          ./beacon-chain/core/altair
          ./beacon-chain/core/epoch
          ./beacon-chain/execution
          ./beacon-chain/operations/attestations
          ./cmd/prysmctl/testnet
          ./config/params
          ./testing/assertions
          ./time/slots
          ./validator/client
          ./beacon-chain/sync/initial-sync
          ./config/features
      # LightChain: the last two packages above are for the execution-client fault guards (audit 2026-11-20 S1, S2, S4):
      # initial sync must not downscore peers for an engine INVALID, and the --allow-duties-with-el-rejecting-head flag.

      # LightChain: the execution-client fault guards in two packages that cannot run whole here: beacon-chain/sync has
      # timing tests that fail under load (TestFilterSubnetPeers, TestProcessAttestationBucket), and the validator RPC
      # package has 21 tests that fail on main without Bazel's config (Slashings length, sync aggregate, duties v2). So
      # only the guard tests and the existing tests of the code they change: block subscriber, gossip block validation,
      # pending block queue, attestation data and the optimistic block-production check.
      - run: >
          go test -count=1 -tags develop -timeout 30m
          -run 'EngineInvalid|BeaconBlockSubscribe|beaconBlockSubscriber|ValidateBeaconBlockPubSub|PendingBlocks|ExecutionRejectedNewerThanHead|^TestGetAttestationData|^TestServer_GetBeaconBlock_Optimistic$'
          ./beacon-chain/sync
          ./beacon-chain/rpc/prysm/v1alpha1/validator
