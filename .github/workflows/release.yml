# Versioned node release: builds the linux/amd64 Prysm image external validators
# install, smoke-tests it, and pushes it to GHCR. One image carries beacon-chain,
# validator and prysmctl (see Dockerfile).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build (e.g. v7.1.2-lc.1)"
        required: true

env:
  IMAGE: ghcr.io/lightchain-protocol/prysm

jobs:
  # LightChain: release gate (audit 2026-11-20, R1). Before this job existed any pushed v* tag, from any branch, was
  # published after the two-command smoke test below, with no unit test run. The release job now needs this one:
  # it refuses a tag whose commit is not on main or on a release/* branch, then runs the tests of ci.yml on that
  # commit. The release job builds the commit this job tested, not whatever the tag points to by then.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.provenance.outputs.commit }}
    steps:
      # LightChain: full history and every branch, so the ancestry check below can see main and release/*.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      # LightChain: tag provenance, the first check. The ref must be a tag, and its commit must be an ancestor of (or
      # equal to) origin/main or an origin/release/* branch. A tag on a feature or hotfix branch is refused: the
      # deployed lc.2.x line must be released from a release/2.x branch, not from hotfix/inactivity-penalty-overflow.
      - id: provenance
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! commit=$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}"); then
            echo "::error::${TAG} is not a tag in this repository"
            exit 1
          fi
          test "$commit" = "$(git rev-parse HEAD)"
          git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null || { echo "::error::origin/main was not fetched"; exit 1; }
          for branch in $(git for-each-ref --format='%(refname)' refs/remotes/origin/main 'refs/remotes/origin/release/*'); do
            if git merge-base --is-ancestor "$commit" "$branch"; then
              echo "${TAG} (${commit}) is on ${branch#refs/remotes/}"
              echo "commit=${commit}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::${TAG} (${commit}) is not on origin/main or on any origin/release/* branch; refusing to release it"
          exit 1

      # LightChain: same Go version as ci.yml.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # LightChain: the tests. The commands are read from the check job of ci.yml in the tagged commit, so the gate
      # runs exactly what CI runs for that commit and the two lists cannot drift. Fails if ci.yml is missing, if it has
      # no go test command, or if a step uses an option (env, shell, working-directory) this loop would not copy.
      - name: Tests from ci.yml
        run: |
          set -euo pipefail
          ci=.github/workflows/ci.yml
          extra=$(yq '.jobs.check.steps[] | select(has("run")) | keys | .[]' "$ci" | grep -vxE 'name|run' || true)
          if [ -n "$extra" ]; then
            echo "::error::a run step of ci.yml uses options the release gate does not copy: ${extra}"
            exit 1
          fi
          n=$(yq '.jobs.check.steps | map(select(has("run"))) | length' "$ci")
          yq '.jobs.check.steps[] | select(has("run")) | .run' "$ci" | grep 'go test' > /dev/null
          for i in $(seq 0 $((n - 1))); do
            cmd=$(yq ".jobs.check.steps | map(select(has(\"run\"))) | .[${i}].run" "$ci")
            echo "::group::${cmd}"
            bash -euo pipefail -c "$cmd"
            echo "::endgroup::"
          done

  release:
    # LightChain: publish only after the provenance check and the tests passed on this commit.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # LightChain: build the commit the test job checked and tested, not the tag name again (a tag can be moved).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.commit }}

      - id: vars
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build first without pushing so the smoke test runs against the exact
      # image the push step then uploads (the second build is a cache hit).
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          build-args: |
            VCS_REF=${{ steps.vars.outputs.commit }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke
        env:
          REF: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
        run: |
          docker run --rm "$REF" beacon-chain --version

          # The strict YAML loader only *logs* unknown config fields, so a run
          # that exits 0 is not enough — the parse-issue line must be absent too,
          # otherwise a build that lost the fork-specific keys would still pass.
          docker run --rm -v "$PWD/.github:/smoke:ro" "$REF" \
            prysmctl testnet generate-genesis \
              --chain-config-file=/smoke/smoke-config.yml \
              --num-validators=4 --fork=electra \
              --output-ssz=/tmp/genesis.ssz 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -q 'Done writing genesis state' "$RUNNER_TEMP/smoke.log"
          ! grep -q 'issues parsing the config' "$RUNNER_TEMP/smoke.log"

      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha }}
          build-args: |
            VCS_REF=${{ steps.vars.outputs.commit }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Manifest
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          SHA_TAG: ${{ steps.vars.outputs.sha }}
          COMMIT: ${{ steps.vars.outputs.commit }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          jq -n '{component:"cl", image:$image, tag:$tag, sha_tag:$sha, commit:$commit,
                  digest:$digest, platform:"linux/amd64", built_at:(now|todate)}' \
            --arg image "$IMAGE" --arg tag "$TAG" --arg sha "$SHA_TAG" \
            --arg commit "$COMMIT" --arg digest "$DIGEST" > release-manifest.json
          cat release-manifest.json
          {
            echo "### prysm \`$TAG\`"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| image | \`$IMAGE:$TAG\` |"
            echo "| also tagged | \`$SHA_TAG\` |"
            echo "| digest | \`$DIGEST\` |"
            echo "| commit | \`$COMMIT\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-cl-${{ steps.vars.outputs.tag }}
          path: release-manifest.json
